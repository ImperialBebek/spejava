name: Validate and publish

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix studio
      - run: npm --prefix studio run check
      - name: Validate the editor build without project credentials
        run: SANITY_STUDIO_PROJECT_ID=checkonly SANITY_STUDIO_DATASET=production npm --prefix studio run build
      - run: npm test
      - run: npm run build
      - name: Publish approved main branch to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3e5477c0d876280e8202b85baf22e587
          wranglerVersion: '4.165.0'
          command: pages deploy dist --project-name spejava --branch main
